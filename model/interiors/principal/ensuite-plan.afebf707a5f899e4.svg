<text x="620" y="163" font-size="18" font-weight="600">01  A dry walk-through</text>
<text x="620" y="191" class="note">Bedroom → dressing → closable bathroom.</text>
<text x="620" y="214" class="note">Wardrobe and its window move 750 mm toward bed.</text>
<text x="620" y="262" font-size="18" font-weight="600">02  Proper wardrobe depth</text>
<text x="620" y="290" class="note">3.9 m tall frontage, 650 mm deep.</text>
<text x="620" y="313" class="note">Double/long hanging, drawers, shoes and overheads.</text>
<text x="620" y="336" class="note">Low 1.6 m drawers sit below the window sill.</text>
<text x="620" y="384" font-size="18" font-weight="600">03  A bathroom for two</text>
<text x="620" y="412" class="note">1.8 m double vanity with separate passing space.</text>
<text x="620" y="435" class="note">WC faces north, screened from the entrance.</text>
<text x="620" y="458" class="note">Doorless shower: about 895 mm clear entry.</text>
<text x="620" y="506" font-size="18" font-weight="600">04  Routes that reflect real use</text>
<text x="620" y="534" class="note">Green dashed: walking routes. Brown: occupied use.</text>
<text x="620" y="557" class="note">Door arcs show the full opening sweep.</text>
<text x="620" y="580" class="note">The longer bathroom adds a clear arrival area.</text>
<text x="620" y="603" class="note">New east window sits behind the bath.</text>
<text x="620" y="651" font-size="18" font-weight="600">05  Details still to resolve</text>
<text x="620" y="679" class="note">Drainage, structure, extraction and waterproofing.</text>
<text x="620" y="702" class="note">Survey, final fittings and bath cleaning access.</text>
<text x="620" y="725" class="note">This is the isolated suite, before house integration.</text>
<text x="125" y="945" class="note">← From the accepted bedroom</text><text x="620" y="945" class="note">Dimensions in metres; fixture silhouettes are diagrammatic.</text></svg>