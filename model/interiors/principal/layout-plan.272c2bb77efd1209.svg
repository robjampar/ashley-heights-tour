<text x="825" y="218" class="eyebrow">01</text><text x="825" y="246" font-size="18" font-weight="600">One TV, two comfortable views</text>
<text x="825" y="280" class="note">The bed faces west. The sofa angles</text>
<text x="825" y="303" class="note">towards the same fixed screen.</text>
<text x="825" y="326" class="note">Bed ≈ 3.7 m · sofa ≈ 4.3 m.</text>
<text x="825" y="384" class="eyebrow">02</text><text x="825" y="412" font-size="18" font-weight="600">Dressing becomes the priority</text>
<text x="825" y="446" class="note">7.6 → 27.3 m² including circulation.</text>
<text x="825" y="469" class="note">The former office becomes wardrobes.</text>
<text x="825" y="492" class="note">Slim drawer island with ~1 m aisles.</text>
<text x="825" y="550" class="eyebrow">03</text><text x="825" y="578" font-size="18" font-weight="600">A compact place to work</text>
<text x="825" y="612" class="note">1.5 m desk at the north window.</text>
<text x="825" y="635" class="note">4.7 m² nook instead of the 24 m² study.</text>
<text x="825" y="658" class="note">No extra room or extension needed.</text>
<text x="825" y="716" class="eyebrow">04</text><text x="825" y="744" font-size="18" font-weight="600">Keep the existing envelope</text>
<text x="825" y="778" class="note">Windows, bathroom and WC retained.</text>
<text x="825" y="801" class="note">Dotted line = removed partition.</text>
<text x="825" y="824" class="note">Blue lines = existing glazing.</text>
