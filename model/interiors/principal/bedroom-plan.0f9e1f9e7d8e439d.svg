<text x="624.1" y="294.1" class="small" text-anchor="middle">24.5 m² reserved</text>
<text x="624.1" y="320.5" class="small" text-anchor="middle">Detailed fit is the next step</text>
<text x="624.1" y="346.9" class="small" text-anchor="middle">Bathroom services unresolved</text>
