<text x="577.9" y="751.5" class="small" text-anchor="middle">CLEAR FOOT ROUTE</text>
<text x="350.2" y="910.5" class="small" text-anchor="middle">DESK</text>
<text x="126.5" y="693.4" class="small" text-anchor="middle">LOW VAULT</text>
<text x="126.5" y="888.1" class="small" text-anchor="middle">LOW VAULT</text>
<text x="825" y="190" font-size="16" font-weight="600">01  A real headboard wall</text><text x="825" y="217" font-size="13">Existing solid south wall.</text><text x="825" y="238" font-size="13">Two 600 mm bedsides and reading lights.</text>
<text x="825" y="312" font-size="16" font-weight="600">02  Straight-ahead viewing</text><text x="825" y="339" font-size="13">85-inch bed TV; 55-inch sofa TV.</text><text x="825" y="360" font-size="13">Both fixed. No rotating mechanism.</text>
<text x="825" y="434" font-size="16" font-weight="600">03  Two complete furniture groups</text><text x="825" y="461" font-size="13">2.3 m sofa, coffee table and side table.</text><text x="825" y="482" font-size="13">400 mm sofa-to-table reach gap.</text>
<text x="825" y="556" font-size="16" font-weight="600">04  Room to move</text><text x="825" y="583" font-size="13">1.2 m central route after the entrance.</text><text x="825" y="604" font-size="13">1 m checked side and desk routes.</text>
<text x="825" y="678" font-size="16" font-weight="600">05  Desk beside daylight</text><text x="825" y="705" font-size="13">1.8 × 0.7 m top; 900 mm chair space.</text><text x="825" y="726" font-size="13">Separate passing route behind chair.</text>
<text x="825" y="800" font-size="16" font-weight="600">06  Keep the shell</text><text x="825" y="827" font-size="13">Retain windows, entrance and vault.</text><text x="825" y="848" font-size="13">Old bathroom moves to the north wing.</text>
<text x="64" y="1037" font-size="13">Model-based dimensions · 950 mm nominal entry opening · Native eye-level views accompany this plan</text>
