<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850"><style>text{font-family:Arial;fill:#34483c}</style><rect width="760" height="850" fill="#fffdf7"/><text x="45" y="45" font-size="29">Original office · work, read and breathe</text><text x="45" y="80" font-size="17">Retain the bay, original walls and hall double doors</text><polygon points="99.5,640.5 207.66,640.5 285.4,673.0 342.6,684.7 453.1,684.7 506.4,673.0 581.8,640.5 629.9000000000001,640.5 629.9000000000001,154.29999999999998 99.5,154.29999999999998" fill="#ede8dd" stroke="#817764"/><rect x="264.6" y="296.0" width="104.00000000000003" height="233.99999999999997" rx="5" fill="#c5b392" stroke="#817764"/><rect x="124.2" y="157.54999999999998" width="351.0" height="56.550000000000004" rx="5" fill="#c5b392" stroke="#817764"/><rect x="503.79999999999995" y="494.9" width="107.9" height="113.1" rx="5" fill="#c5b392" stroke="#817764"/><circle cx="207.39999999999998" cy="413.0" r="41.6" fill="#d8d1c1" stroke="#817764"/><circle cx="563.6" cy="449.4" r="24.7" fill="#d8d1c1" stroke="#817764"/><circle cx="164.5" cy="280.4" r="19.5" fill="#d8d1c1" stroke="#817764"/><text x="268.5" y="413.0" font-size="15">Desk</text><text x="163.2" y="481.9" font-size="15">Chair</text><text x="177.5" y="193.3" font-size="15">Books + sliding storage</text><text x="466.1" y="566.4000000000001" font-size="15">Read</text><text x="545.4000000000001" y="231.00000000000003" font-size="15">Hall</text><text x="45" y="745" font-size="16">The 1.8 m desk faces into the room, with daylight from the side.</text><text x="45" y="772" font-size="16">The chair can move back without occupying the hall approach.</text><text x="45" y="799" font-size="16">Storage uses the north wall; the bay remains open and visible.</text></svg>