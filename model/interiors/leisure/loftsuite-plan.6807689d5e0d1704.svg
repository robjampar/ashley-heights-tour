y="186" font-size="17">Standing routes check a 600 mm body and a</text><text x="535" y="210" font-size="17">200 mm head footprint beneath the measured roof.</text><text x="535" y="234" font-size="17">The dormer is about 2090 mm above the floor.</text><text x="535" y="288" font-size="21" font-weight="600">Keep a solid bed wall.</text><text x="535" y="317" font-size="17">The 1500 × 2000 mm king faces the wardrobe.</text><text x="535" y="341" font-size="17">Both sides and the foot remain reachable.</text><text x="535" y="365" font-size="17">A small 205 mm east bedside preserves the door.</text><text x="535" y="419" font-size="21" font-weight="600">Put the low space to work.</text><text x="535" y="448" font-size="17">Low eaves and hip-store shelving removed.</text><text x="535" y="472" font-size="17">The 1970 mm wardrobe has sliding fronts.</text><text x="535" y="496" font-size="17">The hip-store doorway remains low.</text><text x="535" y="550" font-size="21" font-weight="600">Retain the existing envelope.</text><text x="535" y="579" font-size="17">Roof, dormer windows and partitions remain.</text><text x="535" y="603" font-size="17">The doors are rehung within the same apertures.</text><text x="535" y="627" font-size="17">Bathroom service positions stay broadly familiar.</text><text x="535" y="681" font-size="21" font-weight="600">Fit the shower to the actual height.</text><text x="535" y="710" font-size="17">A low tray and lower rainfall fitting suit the dormer.</text><text x="535" y="734" font-size="17">The window keeps waterproof internal returns.</text><text x="535" y="758" font-size="17">The ensuite is planned for one person at a time.</text><text x="48" y="855" font-size="17">Tinted band: less than 2 m roof clearance · dashed line: approximate 2 m height</text><text x="48" y="889" font-size="16">Developed concept · final roof lining, services, shower specification and site dimensions require detailed design.</text></svg>