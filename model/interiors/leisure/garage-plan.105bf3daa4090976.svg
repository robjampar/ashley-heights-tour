<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1040"><style>text{font-family:Arial;fill:#33453b}</style><rect width="940" height="1040" fill="#fffdf7"/><text x="48" y="48" font-size="28">Double garage · parking before storage</text><text x="48" y="84" font-size="17">Retained shell, two staggered cars, a practical east-wall bench and cupboards</text><polygon points="87.84,716.7599999999999 248.16,716.7599999999999 248.16,737.496 827.9999999999999,737.496 827.9999999999999,156.1199999999999 87.84,156.1199999999999" fill="#eee9df" stroke="#807765" stroke-width="3"/><rect x="771.3599999999999" y="545.8799999999999" width="54.72000000000003" height="184.32" rx="4" fill="#bdab8a" stroke="#827864"/><rect x="204.0" y="483.4799999999999" width="422.4000000000001" height="172.80000000000007" rx="4" fill="#c6ccc7" stroke="#827864"/><text x="380.20000000000005" y="569.8799999999999" font-size="18">G1 · 4.4 m</text><path d="M506.40000000000003 650.52L427.9239064295872 721.1801920314954" stroke="#aa7352" stroke-width="4"/><path d="M506.40000000000003 489.23999999999995L427.9239064295872 418.5798079685045" stroke="#aa7352" stroke-width="4"/><rect x="338.40000000000003" y="232.91999999999996" width="422.4" height="172.80000000000007" rx="4" fill="#c6ccc7" stroke="#827864"/><text x="514.6" y="319.32" font-size="18">G2 · 4.4 m</text><path d="M640.8 399.96L562.3239064295872 470.62019203149544" stroke="#aa7352" stroke-width="4"/><path d="M640.8 238.68L562.3239064295872 168.01980796850455" stroke="#aa7352" stroke-width="4"/><path d="M256.79999999999995 145.07999999999987L343.20000000000005 145.07999999999987" stroke="#648a8c" stroke-width="7"/><path d="M839.0399999999998 523.8L839.0399999999998 437.39999999999986" stroke="#648a8c" stroke-width="7"/><path d="M76.79999999999998 697.56L76.79999999999998 175.32" stroke="#648a8c" stroke-width="7"/><text x="232.79999999999998" y="106.19999999999993" font-size="14">To house</text><text x="794.4" y="490.19999999999993" font-size="14">Utility</text><text x="712.8" y="643.8" font-size="14">Storage / bench</text><text x="50.39999999999999" y="778.1999999999999" font-size="14">Overhead garage door retained</text><text x="48" y="878" font-size="16">Cars are staggered to separate their front-door use and leave a useful worktop approach.</text><text x="48" y="905" font-size="16">The drawn front-door positions are 42° openings; actual household vehicles need checking.</text><text x="48" y="932" font-size="16">The fourth outside space is separate from this room and is tested with all other bays occupied.</text><text x="48" y="959" font-size="16">The room outline follows the actual south wall; the previous oversized plan record is corrected.</text></svg>