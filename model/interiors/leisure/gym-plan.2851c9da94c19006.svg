ext><text x="55" y="895" class="body">Rowing uses that space only with both treadmills switched off; it is not a third simultaneous cardio position.</text><text x="55" y="924" class="body">The rower separates into two parts for storage. The dumbbell bench stays in place.</text><text x="55" y="953" class="body">Bench and cycling activity areas are tested separately. The room is not an unrestricted multi-user gym.</text><text x="55" y="982" class="body">MyRun and Concept2 dimensions guide the fit. Selected products, exercises, floor loads and ventilation need review.</text><text x="55" y="1011" class="body">PLAN DEVELOPMENT — review the route tests and eye-level model before adopting this arrangement.</text></svg>