<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720"><style>text{font-family:Arial;fill:#34483c}</style><rect width="800" height="720" fill="#fffdf7"/><text x="45" y="43" font-size="29">Garden workshop · a clear place to make</text><text x="45" y="79" font-size="17">Retained Proposed-only shell, glazing, door and garden path</text><rect x="83.75" y="148.17999999999998" width="589.9499999999997" height="391.30499999999995" rx="4" fill="#ede8dd" stroke="#817764"/><rect x="102.74999999999993" y="151.59999999999977" width="512.9999999999999" height="59.85000000000024" rx="4" fill="#c5b392" stroke="#817764"/><rect x="87.54999999999993" y="329.2499999999999" width="52.25000000000007" height="152.00000000000014" rx="4" fill="#c5b392" stroke="#817764"/><rect x="250.0" y="371.04999999999995" width="151.9999999999998" height="76.00000000000007" rx="4" fill="#c5b392" stroke="#817764"/><text x="259.4999999999998" y="189.59999999999997" font-size="14">5.4 m daylit workbench</text><text x="97.99999999999986" y="410.0" font-size="14">Storage</text><text x="264.2499999999999" y="412.8499999999998" font-size="14">Mobile worktable</text><text x="549.2499999999999" y="357.74999999999994" font-size="14">Clear entry</text><text x="45" y="610" font-size="16">Worktops sit 900 mm above the actual floor, with a clear central aisle.</text><text x="45" y="637" font-size="16">Sliding storage fronts and a mobile table keep the space flexible.</text><text x="45" y="664" font-size="16">The existing 880 mm strip path and outbuilding footprint remain.</text></svg>