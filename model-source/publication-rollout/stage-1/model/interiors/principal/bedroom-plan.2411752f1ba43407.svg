<text x="825" y="190" font-size="16" font-weight="600">01  A real headboard wall</text><text x="825" y="217" font-size="13">Existing solid south wall.</text><text x="825" y="238" font-size="13">Two 600 mm bedsides and reading lights.</text>
<text x="825" y="312" font-size="16" font-weight="600">02  Straight-ahead viewing</text><text x="825" y="339" font-size="13">Matching fixed 85-inch screens.</text><text x="825" y="360" font-size="13">Both fixed. No rotating mechanism.</text>
<text x="825" y="434" font-size="16" font-weight="600">03  Two complete furniture groups</text><text x="825" y="461" font-size="13">2.3 m sofa, coffee table and side table.</text><text x="825" y="482" font-size="13">400 mm sofa-to-table reach gap.</text>
<text x="825" y="556" font-size="16" font-weight="600">04  Room to move</text><text x="825" y="583" font-size="13">1.2 m central route after the entrance.</text><text x="825" y="604" font-size="13">1 m checked side and desk routes.</text>
<text x="825" y="678" font-size="16" font-weight="600">05  Desk beside daylight</text><text x="825" y="705" font-size="13">Equal 1.8 m L sides; curved inner corner.</text><text x="825" y="726" font-size="13">Swivel chair; 1 m separate passing.</text>
<text x="825" y="800" font-size="16" font-weight="600">06  Requested window changes</text><text x="825" y="827" font-size="13">Middle + wardrobe windows shift 750 mm.</text><text x="825" y="848" font-size="13">New east window behind the bath.</text>
<text x="64" y="1037" font-size="13">Model-based dimensions · 950 mm nominal entry opening · Native eye-level views accompany this plan</text>
