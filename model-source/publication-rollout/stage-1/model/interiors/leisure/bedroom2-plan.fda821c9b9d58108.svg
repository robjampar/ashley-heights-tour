<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970"><style>text{font-family:Arial,sans-serif;fill:#2d473c}.title{font-size:28px;font-weight:bold}.h{font-size:20px;font-weight:bold}.body{font-size:16px}.small{font-size:12px}.wall{fill:#eeeae0;stroke:#38594a;stroke-width:3}.oak{fill:#c8b491;stroke:#947f5c;stroke-width:2}.white{fill:#faf9f3;stroke:#949b90;stroke-width:2}.chair{fill:#d1d6c5;stroke:#81927e;stroke-width:2}.use{fill:#92b89c44;stroke:#789b82;stroke-dasharray:5 4}</style><rect width="1400" height="970" fill="#faf9f4"/><text x="45" y="48" class="title">Bedroom 2 — keep the bed wall, give storage a better place</text><text x="45" y="80" class="body">Retain the shell, front window, radiator and 737 mm hall opening. Compare complete furniture and arrival space.</text><text x="65" y="133" class="h">A · Existing north storage</text><polygon points="65.0,592.24 627.5999999999999,592.24 627.5999999999999,170.0 190.28,170.0 190.28,256.072 65.0,256.072" class="wall"/><rect x="388.06" y="291.22" width="240.11999999999983" height="187.92" rx="3" class="white"/><text x="508.1199999999999" y="385.18" text-anchor="middle" class="small">King bed</text><rect x="555.6799999999998" y="488.42" width="64.96000000000006" height="58.0" rx="3" class="oak"/><rect x="555.6799999999998" y="223.94" width="64.96000000000006" height="58.0" rx="3" class="oak"/><rect x="196.65999999999997" y="167.10000000000002" width="179.79999999999987" height="62.63999999999995" rx="3" class="oak"/><text x="286.5599999999999" y="198.42" text-anchor="middle" class="small">1.55 m</text><path d="M240.64719999999988,592.24L517.5739999999998,592.24" stroke="#6c9cab" stroke-width="6"/><rect x="292.12800000000004" y="582.2639999999999" width="174.0" height="9.976" rx="3" class="white"/><text x="65" y="660" class="body">Existing 1.55 m wardrobe is only about 540 mm deep.</text><text x="65" y="688" class="body">Simple bed and bedsides have a useful east-wall position.</text><text x="65" y="716" class="body">The old open door projects into the hall.</text><text x="755" y="133" class="h">B · West storage and reading corner</text><polygon points="755.0,592.24 1317.6,592.24 1317.6,170.0 880.28,170.0 880.28,256.072 755.0,256.072" class="wall"/><rect x="1053.6999999999998" y="288.9" width="259.84000000000003" height="192.56" rx="3" class="white"/><text x="1183.62" y="385.17999999999995" text-anchor="middle" class="small">King bed</text><rect x="1245.6799999999998" y="488.42" width="64.96000000000006" height="58.0" rx="3" class="oak"/><rect x="1245.6799999999998" y="223.94" width="64.96000000000006" height="58.0" rx="3" class="oak"/><rect x="759.6399999999999" y="356.18" width="75.40000000000003" height="232.0" rx="3" class="oak"/><text x="797.3399999999999" y="472.18" text-anchor="middle" class="small">2.00 m</text><rect x="891.2999999999998" y="174.64000000000001" width="88.15999999999997" height="90.47999999999998" rx="3" class="chair"/><text x="935.3799999999999" y="219.88" text-anchor="middle" class="small">reading</text><rect x="982.94" y="174.05999999999997" width="37.12000000000003" height="37.12000000000003" rx="3" class="oak"/><rect x="900.5799999999999" y="245.97999999999996" width="69.59999999999997" height="69.60000000000001" rx="3" class="use"/><rect x="771.2399999999999" y="248.532" width="4.640000000000107" height="79.69199999999998" rx="3" class="white"/><polyline points="853.252,248.532 852.9487478803273,255.47761545104638 852.0412994530489,262.370370574633 850.5365609486284,269.1578073423101 848.4459843356706,275.7882692619092 845.7854801645249,282.2112945146398 842.5752964783894,288.37800000000004 838.8398647134783,294.24145336568756 834.6076137610376,299.7570301911397 829.9107536063183,304.8827536063183 824.7850301911398,309.57961376103765 819.2694533656877,313.8118647134783 813.4060000000001,317.5472964783895 807.2392945146398,320.75748016452474 800.8162692619093,323.4179843356706 794.1858073423102,325.5085609486284 787.398370574633,327.01329945304894 780.5056154510463,327.9207478803274 773.5600000000001,328.224" fill="none" stroke="#7d9987" stroke-dasharray="4 4"/><path d="M930.6471999999999,592.24L1207.5739999999998,592.24" stroke="#6c9cab" stroke-width="6"/><rect x="982.128" y="582.2639999999999" width="174.0" height="9.976" rx="3" class="white"/><text x="755" y="660" class="body">650 mm-deep sliding storage stops before the doorway.</text><text x="755" y="688" class="body">A 1.50 × 2.00 m mattress has a 1.66 × 2.24 m full frame.</text><text x="755" y="716" class="body">Test the inward door, reading knees and both bed sides.</text><text x="45" y="815" class="body">Keep the window and radiator accessible; a recessed Roman blind avoids loose fabric across them.</text><text x="45" y="847" class="body">The entrance opening stays in place. A changed leaf must be checked as a complete assembly through its sweep.</text><text x="45" y="879" class="body">WORKING STUDY — native geometry, occupied circulation and ordinary views are still to be verified.</text></svg>