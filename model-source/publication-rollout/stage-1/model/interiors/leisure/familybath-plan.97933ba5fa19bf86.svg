<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970"><style>text{font-family:Arial,sans-serif;fill:#2d473c}.title{font-size:28px;font-weight:bold}.h{font-size:20px;font-weight:bold}.body{font-size:16px}.small{font-size:12px}.wall{fill:#eeeae0;stroke:#38594a;stroke-width:3}.oak{fill:#c8b491;stroke:#947f5c;stroke-width:2}.white{fill:#faf9f3;stroke:#949b90;stroke-width:2}.use{fill:#92b89c44;stroke:#789b82;stroke-dasharray:5 4}</style><rect width="1400" height="970" fill="#faf9f4"/><text x="45" y="48" class="title">Family bathroom — keep the service layout, improve the approach</text><text x="45" y="80" class="body">Retain the north bath and privacy window, west basin, east WC and south doorway.</text><text x="75" y="133" class="h">A · Existing long cabinet</text><polygon points="140.0,612.0200000000001 497.2299999999999,612.0200000000001 497.2299999999999,411.86 411.0499999999999,411.86 411.0499999999999,170.0 140.0,170.0" class="wall"/><rect x="145.5599999999999" y="174.17000000000004" width="261.3200000000001" height="108.42000000000003" rx="3" class="white"/><text x="276.2199999999999" y="228.38000000000005" text-anchor="middle" class="small">Full-size fitted bath</text><rect x="140.0" y="344.0975000000001" width="82.98299999999993" height="245.33499999999995" rx="3" class="oak"/><text x="181.49149999999997" y="466.76500000000004" text-anchor="middle" class="small">1.73 m</text><rect x="409.6599999999999" y="434.795" width="89.65500000000006" height="63.94" rx="3" class="white"/><text x="454.48749999999995" y="466.765" text-anchor="middle" class="small">WC</text><path d="M172.02559999999994,170.0L382.1936,170.0" stroke="#6c9cab" stroke-width="6"/><text x="75" y="670" class="body">The vanity occupies most of the west wall.</text><text x="75" y="698" class="body">Bath, basin and WC have useful service positions.</text><text x="75" y="726" class="body">Keep the existing room and privacy window.</text><text x="765" y="133" class="h">B · Floating vanity, clearer arrival</text><polygon points="830.0,612.0200000000001 1187.23,612.0200000000001 1187.23,411.86 1101.05,411.86 1101.05,170.0 830.0,170.0" class="wall"/><rect x="835.5599999999998" y="174.17000000000004" width="261.3200000000001" height="108.42000000000003" rx="3" class="white"/><text x="966.2199999999999" y="228.38000000000005" text-anchor="middle" class="small">Full-size fitted bath</text><rect x="835.5599999999998" y="381.975" width="70.8900000000001" height="166.8" rx="3" class="oak"/><text x="871.0049999999999" y="465.375" text-anchor="middle" class="small">1.20 m</text><rect x="1085.065" y="440.355" width="75.06" height="55.60000000000005" rx="3" class="white"/><text x="1122.595" y="468.15500000000003" text-anchor="middle" class="small">WC</text><rect x="1160.125" y="420.2000000000001" width="23.62999999999999" height="95.90999999999993" rx="3" class="oak"/><rect x="909.925" y="423.675" width="83.40000000000008" height="83.40000000000008" rx="3" class="use"/><rect x="1108.556" y="512.3709000000001" width="5.560000000000005" height="108.68409999999992" rx="3" class="white"/><polyline points="1002.6379999999999,621.0550000000001 1003.0515758131269,611.5825565396393 1004.2891556908457,602.1822040936296 1006.3413209030163,592.925485020173 1009.1924532332422,583.8828485407787 1012.82085384293,575.1231145791476 1017.1989084125515,566.71295 1022.2932973032906,558.7163612339793 1028.0652491396127,551.1942071500673 1034.470835882843,544.2037358828431 1041.4613071500671,537.7981491396126 1048.9834612339791,532.0261973032907 1056.98005,526.9318084125517 1065.3902145791476,522.5537538429301 1074.1499485407785,518.9253532332423 1083.192585020173,516.0742209030163 1092.4493040936295,514.0220556908458 1101.8496565396392,512.7844758131268 1111.3220999999999,512.3709" fill="none" stroke="#7d9987" stroke-dasharray="4 4"/><path d="M862.0255999999999,170.0L1072.1936,170.0" stroke="#6c9cab" stroke-width="6"/><text x="765" y="670" class="body">A 1.20 m vanity releases approach and drying space.</text><text x="765" y="698" class="body">A right-hinged inward leaf avoids the WC approach.</text><text x="765" y="726" class="body">Test separate fixture uses and the extended drawer.</text><text x="45" y="825" class="body">The bath remains fitted: model its hollow well, rim, waste, overflow and hand shower, with a serviceable apron.</text><text x="45" y="857" class="body">Separate use states reserve space at the basin, WC and bath. Door and drawer movements need native checks.</text><text x="45" y="889" class="body">LAYOUT STUDY — see the room review for completed checks and practical limits.</text></svg>