<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1120"><style>text{font-family:Arial;fill:#34483c}</style><rect width="820" height="1120" fill="#fffdf7"/><text x="45" y="43" font-size="29">Garden rooms · changing, resting and useful storage</text><text x="45" y="79" font-size="17">Retain the narrow summer house, outside WC and tool-store shells</text><rect x="244.15999999999997" y="481.0400000000002" width="197.11999999999998" height="423.35999999999973" rx="4" fill="#eee9de" stroke="#817764"/><rect x="239.68000000000006" y="174.15999999999997" width="201.59999999999988" height="175.84000000000003" rx="4" fill="#eee9de" stroke="#817764"/><rect x="239.68000000000006" y="364.5599999999999" width="201.59999999999988" height="101.92000000000002" rx="4" fill="#eee9de" stroke="#817764"/><rect x="257.03999999999996" y="825.44" width="174.71999999999986" height="70.55999999999989" rx="4" fill="#c5b392" stroke="#817764"/><rect x="389.19999999999993" y="670.8799999999999" width="49.28000000000014" height="90.72000000000025" rx="4" fill="#c5b392" stroke="#817764"/><rect x="386.96000000000004" y="491.68000000000006" width="50.39999999999992" height="135.5200000000001" rx="4" fill="#c5b392" stroke="#817764"/><rect x="260.4000000000001" y="306.31999999999994" width="71.67999999999986" height="42.0" rx="4" fill="#c5b392" stroke="#817764"/><rect x="409.3600000000001" y="190.39999999999992" width="29.119999999999976" height="76.15999999999997" rx="4" fill="#c5b392" stroke="#817764"/><rect x="412.72" y="370.71999999999986" width="25.760000000000048" height="89.60000000000008" rx="4" fill="#c5b392" stroke="#817764"/><rect x="337.68000000000006" y="207.20000000000016" width="67.19999999999996" height="44.79999999999984" rx="4" fill="#fffdf3" stroke="#817764"/><path d="M244.72000000000006 641.76L438.48000000000013 641.76" stroke="#97866b" stroke-width="4" stroke-dasharray="6 5"/><text x="186.19999999999996" y="229.60000000000008" text-anchor="end" font-size="16">WC</text><text x="186.19999999999996" y="414.3999999999999" text-anchor="end" font-size="16">Tools</text><text x="186.19999999999996" y="554.3999999999999" text-anchor="end" font-size="16">Changing</text><text x="186.19999999999996" y="739.2000000000002" text-anchor="end" font-size="16">Drinks / towels</text><text x="186.19999999999996" y="862.3999999999999" text-anchor="end" font-size="16">Two-seat bench</text><text x="45" y="964" font-size="15">The changing curtain draws across one end; it stores at the east wall.</text><text x="45" y="989" font-size="15">A 640 mm hand basin and compact WC have separate single-user standing places.</text><text x="45" y="1014" font-size="15">A 230 mm-deep tool rack uses the far wall of the narrow store.</text><text x="45" y="1039" font-size="15">Proposed keeps the open summer-house front; Planning retains glazing with one operable bay.</text><text x="45" y="1064" font-size="15">The pavilion step and the actual raised floors are checked before route integration.</text></svg>