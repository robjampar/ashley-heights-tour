<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120"><style>text{font-family:Arial,sans-serif;fill:#2c4438}.title{font-size:29px;font-weight:700}.h{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:12px}.wall{fill:#eeece2;stroke:#3d5749;stroke-width:3}.fixture{fill:#faf9f3;stroke:#a69171;stroke-width:1.5}.storage{fill:#c7b596;stroke:#8b775a;stroke-width:1.5}.glass{fill:#b6cfcd44;stroke:#719896;stroke-width:2}.use{fill:#a1c4af44;stroke:#749586;stroke-dasharray:5 4}</style><rect width="1500" height="1120" fill="#faf9f4"/><text x="50" y="51" class="title">Garden guest ensuite — a compact room, considered in use</text><text x="50" y="84" class="body">Retain its walls, high north window, bedroom opening and three service positions.</text><text x="70" y="147" class="h">A · Existing fixture proportions</text><polygon points="70.0,569.96 216.32000000000002,569.96 216.32000000000002,725.7200000000001 501.8800000000002,725.7200000000001 501.8800000000002,190.0 70.0,190.0" class="wall"/><path d="M219.86000000000016,190.0L458.47959999999995,190.0" stroke="#6f9ca9" stroke-width="7" fill="none" stroke-dasharray=""/><path d="M501.8800000000002,501.992L501.8800000000002,325.70000000000005" stroke="#faf9f4" stroke-width="8" fill="none" stroke-dasharray=""/><rect x="72.36000000000016" y="232.48000000000013" width="136.172" height="285.56" class="storage"/><text x="140.44600000000014" y="379.2600000000001" class="small" text-anchor="middle">vanity</text><rect x="304.82000000000005" y="188.82000000000002" width="108.5600000000002" height="152.2200000000001" class="fixture"/><text x="359.10000000000014" y="268.93000000000006" class="small" text-anchor="middle">WC</text><rect x="234.02000000000007" y="540.46" width="254.88000000000022" height="181.7200000000001" class="fixture"/><text x="361.46000000000015" y="635.32" class="small" text-anchor="middle">1080 × 770 shower</text><path d="M238.74000000000018,540.46L484.17999999999995,540.46" stroke="#719896" stroke-width="4" fill="none" stroke-dasharray=""/><text x="70" y="808" class="body">The present vanity projects about 577 mm including knobs.</text><text x="70" y="835" class="body">The shower entrance is shown as one unresolved glass leaf.</text><text x="70" y="862" class="body">The basin, WC and shower can remain on these walls.</text><text x="820" y="147" class="h">B · Retain services, improve the fittings</text><polygon points="820.0,569.96 966.32,569.96 966.32,725.7200000000001 1251.88,725.7200000000001 1251.88,190.0 820.0,190.0" class="wall"/><path d="M969.8600000000001,190.0L1208.4796,190.0" stroke="#6f9ca9" stroke-width="7" fill="none" stroke-dasharray=""/><path d="M1251.88,501.992L1251.88,325.70000000000005" stroke="#faf9f4" stroke-width="8" fill="none" stroke-dasharray=""/><rect x="824.0120000000001" y="328.06" width="110.91999999999994" height="212.4000000000001" class="storage"/><text x="879.472" y="438.26000000000005" class="small" text-anchor="middle">900 × 470 vanity</text><rect x="1008.8000000000002" y="192.36000000000016" width="200.60000000000014" height="37.75999999999982" class="storage"/><rect x="1063.0800000000002" y="230.11999999999998" width="92.04000000000013" height="127.44000000000001" class="fixture"/><text x="1109.1000000000001" y="297.84" class="small" text-anchor="middle">WC</text><rect x="968.2080000000001" y="534.088" width="280.8400000000001" height="188.79999999999995" class="fixture"/><text x="1108.6280000000002" y="632.4879999999999" class="small" text-anchor="middle">1190 × 800 shower</text><path d="M969.8600000000001,538.1000000000001L1095.1760000000004,538.1000000000001" stroke="#719896" stroke-width="4" fill="none" stroke-dasharray=""/><path d="M1245.2720000000002,538.1000000000001L1232.3959591894322,685.2738199172823" stroke="#719896" stroke-width="4" fill="none" stroke-dasharray=""/><polyline points="1097.5360000000003,538.1000000000001 1098.037485134852,550.2623734700295 1099.5385359888514,562.3421773632499 1102.028962023607,574.2574026624361 1105.4918558958043,585.9271576639283 1109.903708240083,597.2722171462419 1115.2345672726153,608.2155602250375 1121.448242131853,618.6828932429859 1128.5025485759766,628.6031541446632 1136.3495953690197,637.9089949123072 1144.9361094114097,646.5372387872101 1154.2037974076402,654.4293091726968 1164.0897416157316,661.5316273069017 1174.5268269917633,667.7959760055596 1185.444196829621,673.1798270053912 1196.7677338026492,677.646629685767 1208.4205631414504,681.1660592085361 1220.323574531782,683.7142223914162 1232.3959591894322,685.2738199172823" stroke="#8aa49a" stroke-width="2" stroke-dasharray="5 4" fill="none"/><path d="M1267.22,497.98000000000013L1436.4320000000002,497.98000000000013" stroke="#466958" stroke-width="3" fill="none" stroke-dasharray=""/><path d="M1267.22,497.98000000000013L1267.22,328.76800000000003" stroke="#8aa49a" stroke-width="1" fill="none" stroke-dasharray="4 4"/><rect x="939.6520000000002" y="363.46000000000004" width="141.5999999999999" height="141.5999999999999" class="use"/><rect x="1038.3" y="359.9200000000002" width="141.60000000000034" height="141.5999999999999" class="use"/><circle cx="1047.7400000000002" cy="644.3000000000002" r="70.8" class="use"/><text x="820" y="808" class="body">The room door opens into the bedroom, away from fixtures.</text><text x="820" y="835" class="body">The inward shower leaf stops at 85° to clear its handle.</text><text x="820" y="862" class="body">Basin and WC use overlap: this remains a single-user room.</text><text x="50" y="970" class="body">Manufacturer reference: Matki EPW1200, inward opening. Its published entry is 612 mm; leaf projection is 626 mm.</text><text x="50" y="1004" class="body">The dashed shower circle shows a 600 mm standing body; the complete native sweep is checked including both handles.</text><text x="50" y="1038" class="body">The original compact shell remains. This is a working study, not an accessibility claim or a final waterproofing/service design.</text></svg>