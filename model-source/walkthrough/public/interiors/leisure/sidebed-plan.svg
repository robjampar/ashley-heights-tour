5,497.80 713.45,497.80" fill="#fffdf7" stroke="#8a887d" stroke-width="1.4"/><polygon points="713.45,484.75 762.75,484.75 762.75,407.90 713.45,407.90" fill="#fffdf7" stroke="#8a887d" stroke-width="1.4"/><polygon points="495.95,597.85 542.35,597.85 542.35,394.85 495.95,394.85" fill="#b8a88c" stroke="#8a887d" stroke-width="1.4"/><polygon points="595.27,251.30 595.27,131.82 583.67,131.82 583.67,251.30" fill="#ae956d" stroke="#8a887d" stroke-width="1.4"/><circle cx="589.475" cy="251.29999999999993" r="3" fill="#405e4b"/><polygon points="356.02,431.10 356.02,319.45 344.42,319.45 344.42,431.10" fill="#ae956d" stroke="#8a887d" stroke-width="1.4"/><circle cx="350.2249999999999" cy="431.09999999999997" r="3" fill="#405e4b"/><polygon points="217.99,154.96 88.76,177.75 90.78,189.17 220.01,166.39" fill="#c3d8cf" stroke="#8a887d" stroke-width="1.4"/><circle cx="219.00000000000003" cy="160.67499999999993" r="3" fill="#405e4b"/><text x="102.99999999999991" y="506.49999999999994" font-size="12">1110 mm storage</text><text x="517.7" y="471.7" font-size="14">1350 × 1900</text><text x="95.74999999999994" y="232.44999999999993" font-size="13">1000 × 1000</text><text x="98.65" y="370.19999999999993" font-size="14">WC</text><text x="342.25" y="228.10000000000002" font-size="12">Basin</text><text x="459.7" y="223.75" font-size="14">Hall</text><line x1="393.0" y1="441.25" x2="489.425" y2="441.25" stroke="#477a62" stroke-width="2"/><text x="395.9" y="416.59999999999997" font-size="13">665 mm turn</text><text x="835" y="155" font-size="16">East-wall headboard; access on both sides.</text><text x="835" y="191" font-size="16">940 mm south aisle; 835 mm north aisle.</text><text x="835" y="227" font-size="16">The ensuite partition moves 350 mm west.</text><text x="835" y="263" font-size="16">Both door opening widths are retained.</text><text x="835" y="299" font-size="16">Sliding fronts on wardrobe and basin</text><text x="835" y="323" font-size="16">storage.</text><text x="835" y="359" font-size="16">Hall door opens along the hall side.</text><text x="835" y="395" font-size="16">Seven separate use states checked at 600 mm.</text><text x="835" y="431" font-size="16">Complete doors checked through 91 positions.</text><text x="835" y="467" font-size="16">Windows and external walls stay in place.</text><text x="45" y="787" class="note">Developed concept · dimensions from the model · both Proposed and Planning</text><text x="45" y="820" font-size="16">The 665 mm bed-foot route is single-file. Final selected fittings, services, wall junctions and site dimensions require detailed design.</text></svg>