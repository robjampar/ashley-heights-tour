<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000"><style>text{font-family:Arial,sans-serif;fill:#294036}.title{font-size:28px;font-weight:700}.h{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:12px}.wall{fill:#f0eee5;stroke:#354d42;stroke-width:3}.cabinet{fill:#cdbc9f;stroke:#8a7b63;stroke-width:1.3}.machine{fill:#deded6;stroke:#526558;stroke-width:1.3}.open{fill:#caa470;fill-opacity:.28;stroke:#b28451;stroke-dasharray:7 5}.door{stroke:#496954;stroke-width:3;fill:none}</style><rect width="1200" height="1000" fill="#faf9f4"/><text x="55" y="50" class="title">Utility — a clear route and a useful folding surface</text><text x="55" y="82" class="body">Retain the windows, door openings and east service wall. Actual modelled wall faces: 2.32 × 3.466 m.</text><text x="85" y="166" class="h">A · Existing opposing fittings</text><rect x="85.0" y="195.0" width="336.40000000000003" height="502.57000000000016" class="wall"/><path d="M85.0,374.80000000000007L85.0,244.29999999999998" class="" stroke="#faf9f4" stroke-width="6"/><path d="M171.99999999999994,195.0L302.5,195.0" class="" stroke="#faf9f4" stroke-width="6"/><path d="M68.32499999999996,374.80000000000007L198.82500000000002,374.80000000000007" class="door" /><path d="M421.40000000000003,650.3000000000001L421.40000000000003,505.30000000000007" class="" stroke="#68a0b2" stroke-width="6"/><path d="M195.92500000000007,697.5700000000002L340.92500000000007,697.5700000000002" class="" stroke="#68a0b2" stroke-width="6"/><rect x="325.70000000000005" y="208.04999999999998" width="89.90000000000015" height="464.00000000000017" class="cabinet"/><text x="370.6500000000001" y="444.05000000000007" class="small" text-anchor="middle">Counter</text><rect x="111.09999999999997" y="574.9000000000001" width="92.80000000000008" height="92.80000000000008" class="machine"/><text x="157.5" y="625.3000000000002" class="small" text-anchor="middle">Washer</text><path d="M111.09999999999997,657.5500000000002L111.09999999999997,585.0500000000002" class="" stroke="#b36c54" stroke-width="4"/><rect x="111.09999999999997" y="473.4" width="92.80000000000008" height="92.80000000000008" class="machine"/><text x="157.5" y="523.8000000000001" class="small" text-anchor="middle">Dryer</text><path d="M111.09999999999997,556.05L111.09999999999997,483.55" class="" stroke="#b36c54" stroke-width="4"/><text x="85" y="732.57" class="small">Appliance fronts face the west wall. About 840 mm remains between</text><text x="85" y="750.57" class="small">opposing fittings.</text><text x="685" y="166" class="h">B · One fitted laundry run</text><rect x="685.0" y="195.0" width="336.40000000000003" height="502.57000000000016" class="wall"/><path d="M685.0,374.80000000000007L685.0,244.29999999999998" class="" stroke="#faf9f4" stroke-width="6"/><path d="M772.0,195.0L902.5,195.0" class="" stroke="#faf9f4" stroke-width="6"/><path d="M668.3249999999999,244.29999999999998L798.825,244.29999999999998" class="door" /><path d="M1021.4000000000001,650.3000000000001L1021.4000000000001,505.30000000000007" class="" stroke="#68a0b2" stroke-width="6"/><path d="M795.9250000000001,697.5700000000002L940.9250000000001,697.5700000000002" class="" stroke="#68a0b2" stroke-width="6"/><rect x="916.2750000000001" y="587.95" width="102.22500000000001" height="86.99999999999994" class="machine"/><text x="967.3875" y="635.45" class="small" text-anchor="middle">Washer</text><rect x="856.535" y="589.4000000000001" width="59.740000000000116" height="84.10000000000001" class="open"/><rect x="916.2750000000001" y="500.95000000000016" width="102.22500000000001" height="86.99999999999994" class="machine"/><text x="967.3875" y="548.4500000000002" class="small" text-anchor="middle">Dryer</text><rect x="856.535" y="502.40000000000015" width="59.740000000000116" height="84.10000000000001" class="open"/><rect x="916.2750000000001" y="428.45000000000016" width="102.22500000000001" height="72.5" class="cabinet"/><text x="967.3875" y="468.70000000000016" class="small" text-anchor="middle">Hamper</text><rect x="916.2750000000001" y="312.45000000000005" width="102.22500000000001" height="116.0000000000001" class="cabinet"/><text x="967.3875" y="374.4500000000001" class="small" text-anchor="middle">Sink</text><rect x="916.2750000000001" y="210.9500000000002" width="102.22500000000001" height="101.4999999999999" class="cabinet"/><text x="967.3875" y="265.70000000000016" class="small" text-anchor="middle">Tall</text><path d="M811.1500000000001,244.29999999999998L901.0500000000001,244.29999999999998" class="" stroke="#518879" stroke-width="2"/><text x="685" y="732.57" class="small">1.595 m from worktop to west wall; appliance-open envelopes are shown</text><text x="685" y="750.57" class="small">in amber.</text><text x="55" y="805" class="body">Washer → dryer → pull-out laundry hamper → sink → tall storage. A 1.2 m folding surface sits above the appliances.</text><text x="55" y="834" class="body">The window sill is 1.20 m high; the 935 mm worktop stays below it. Tall joinery occupies the solid north end.</text><text x="55" y="863" class="body">The garage leaf is rehung at the north jamb of its existing opening, keeping the work area usable.</text><text x="55" y="892" class="body">Machine references: 850 × 596 × 643 mm, with a conservative 1077 mm overall depth when open.</text><text x="55" y="921" class="body">Six plan states pass with a 600 mm body: closed/open machines, open hamper, sorting, folding and sink use.</text><text x="55" y="950" class="body">DEVELOPED STUDY — local pipe adjustments, final appliances and detailed installation remain to be verified.</text></svg>