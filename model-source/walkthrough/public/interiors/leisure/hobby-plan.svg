75.00,175.87" fill="#c6beaa" stroke="#938a79" stroke-width="1.3"/><polygon points="258.57,280.13 295.11,280.13 295.11,244.86 258.57,244.86" fill="#ddd0b8" stroke="#938a79" stroke-width="1.3"/><polygon points="431.19,280.13 467.73,280.13 467.73,244.86 431.19,244.86" fill="#ddd0b8" stroke="#938a79" stroke-width="1.3"/><polygon points="508.05,332.74 665.55,332.74 665.55,211.15 508.05,211.15" fill="#ece6dba0" stroke="#b8c3ac" stroke-width="1.3"/><line x1="214.824375" y1="156.96999999999997" x2="309.324375" y2="156.96999999999997" stroke="#7aabaa" stroke-width="6"/><line x1="405.163125" y1="156.96999999999997" x2="499.663125" y2="156.96999999999997" stroke="#7aabaa" stroke-width="6"/><line x1="595.501875" y1="156.96999999999997" x2="690.001875" y2="156.96999999999997" stroke="#7aabaa" stroke-width="6"/><line x1="785.840625" y1="156.96999999999997" x2="880.340625" y2="156.96999999999997" stroke="#7aabaa" stroke-width="6"/><polygon points="55.08,490.24 82.80,490.24 82.80,442.36 55.08,442.36" fill="#c0a77e" stroke="#938a79" stroke-width="1.3"/><polygon points="55.08,433.54 82.80,433.54 82.80,385.66 55.08,385.66" fill="#c0a77e" stroke="#938a79" stroke-width="1.3"/><polygon points="1012.68,490.24 1040.40,490.24 1040.40,442.36 1012.68,442.36" fill="#c0a77e" stroke="#938a79" stroke-width="1.3"/><polygon points="1012.68,433.54 1040.40,433.54 1040.40,385.66 1012.68,385.66" fill="#c0a77e" stroke="#938a79" stroke-width="1.3"/><polygon points="264.24,280.45 312.75,280.45 312.75,242.65 264.24,242.65" fill="#7a9b7440" stroke="#8caa87" stroke-width="1.3"/><polygon points="413.55,280.45 462.06,280.45 462.06,242.65 413.55,242.65" fill="#7a9b7440" stroke="#8caa87" stroke-width="1.3"/><polygon points="833.13,286.75 857.07,286.75 857.07,185.95 833.13,185.95" fill="#7a9b7440" stroke="#8caa87" stroke-width="1.3"/><polygon points="734.85,261.55 754.38,261.55 754.38,213.67 734.85,213.67" fill="#7a9b7440" stroke="#8caa87" stroke-width="1.3"/><text x="309.6" y="257.77" font-size="12">2000 × 1050</text><text x="520.6500000000001" y="260.29" font-size="13">Open hobby area</text><text x="520.6500000000001" y="279.19" font-size="11">No fixed equipment</text><text x="196.83" y="172.71999999999997" font-size="12">Supplies</text><text x="550.89" y="173.34999999999997" font-size="12">Books</text><text x="297.0" y="431.65" font-size="13">Low archive storage</text><text x="69.57000000000001" y="306.90999999999997" font-size="11">Eaves</text><text x="945.9" y="306.90999999999997" font-size="11">Eaves</text><text x="760.05" y="457.47999999999996" font-size="13">Bridge arrival</text><path d="M807.3,485.2 L807.3,349.75 L208.8,349.75" fill="none" stroke="#4d7a60" stroke-width="3" stroke-dasharray="8 6"/><text x="45" y="595" font-size="20" font-weight="600">A movable worktable</text><text x="45" y="626" font-size="17">Two regular making places face each</text><text x="45" y="650" font-size="17">other across a generous project surface.</text><text x="45" y="674" font-size="17">Lockable castors, storage and detailed</text><text x="45" y="698" font-size="17">tools are modelled.</text><text x="425" y="595" font-size="20" font-weight="600">A relaxed east end</text><text x="425" y="626" font-size="17">An ivory sofa, curved reading chair and</text><text x="425" y="650" font-size="17">small limestone tables form a separate</text><text x="425" y="674" font-size="17">sitting group. The main approach remains</text><text x="425" y="698" font-size="17">clear when occupied.</text><text x="805" y="595" font-size="20" font-weight="600">Useful low storage</text><text x="805" y="626" font-size="17">Sliding supplies cupboards and an</text><text x="805" y="650" font-size="17">archive run use the edges. Low eaves</text><text x="805" y="674" font-size="17">shelves keep their original access</text><text x="805" y="698" font-size="17">openings and require stooping.</text><rect x="45" y="761" width="1110" height="110" rx="6" fill="#f0e6ce"/><text x="65" y="790" font-size="20" font-weight="600">Retained bridge: a separate headroom constraint</text><text x="65" y="818" font-size="17">The route beside the loft stair is below 2 m clearance. A narrow line near its east edge has roughly 1.78–1.90</text><text x="65" y="841" font-size="17">m; the roof and stair geometry remain for review. This is not validated as a full-height route for taller</text><text x="65" y="864" font-size="17">people.</text><text x="45" y="905" font-size="16">Developed concept · existing roof, windows, stairs and guards retained · final site dimensions and construction details remain to be resolved.</text></svg>