<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><style>text{font-family:Arial,sans-serif;fill:#283f36}.title{font-size:28px;font-weight:700}.body{font-size:17px}.small{font-size:12px}.furniture{fill:#c4b297;stroke:#7f7260;stroke-width:1.2}.cloth{fill:#9d6068;stroke:#65373f}.activity{fill:#cfddcf;stroke:#75927b;fill-opacity:.4;stroke-dasharray:6 4}</style><rect width="1200" height="1000" fill="#faf9f5"/><text x="55" y="50" class="title">Wine bar, lounge &amp; games</text><text x="55" y="82" class="body">Parisian Art Deco bar, a second high table and a fuller open lounge.</text><polygon points="70.0,420.745 325.78000000000003,420.745 325.78000000000003,876.298 611.17,876.298 611.17,130.0 70.0,130.0" fill="#f0ece2" stroke="#405749" stroke-width="4"/><rect x="307.19" y="135.04" width="292.95" height="244.44" rx="0" class="activity"/><rect x="384.37" y="358.06" width="223.65" height="100.80" rx="0" class="activity"/><text x="496.19" y="412.46" class="small" text-anchor="middle">Darts activity</text><rect x="394.45" y="222.29" width="118.44" height="69.93" rx="0" class="furniture"/><text x="453.67" y="261.26" class="small" text-anchor="middle">Pool</text><rect x="187.18" y="197.41" width="63.00" height="151.20" rx="8" class="cloth"/><text x="218.68" y="277.01" class="small" text-anchor="middle">Sofa</text><rect x="114.73" y="238.36" width="32.76" height="69.30" rx="0" class="furniture"/><text x="131.11" y="277.01" class="small" text-anchor="middle">Table</text><rect x="70.00" y="199.93" width="30.87" height="146.16" rx="0" class="furniture"/><text x="85.44" y="277.01" class="small" text-anchor="middle">TV</text><rect x="387.52" y="835.60" width="214.20" height="37.48" rx="0" class="furniture"/><text x="494.62" y="858.34" class="small" text-anchor="middle">Drinks storage / coolers</text><rect x="409.57" y="702.04" width="126.00" height="45.36" rx="0" class="furniture"/><text x="472.57" y="728.72" class="small" text-anchor="middle">Bar-height island</text><rect x="417.13" y="657.00" width="28.98" height="29.61" rx="8" class="cloth"/><rect x="458.08" y="657.00" width="28.98" height="29.61" rx="8" class="cloth"/><rect x="499.03" y="657.00" width="28.98" height="29.61" rx="8" class="cloth"/><rect x="326.09" y="635.26" width="22.37" height="107.10" rx="8" class="furniture"/><rect x="543.13" y="516.82" width="44.10" height="73.08" rx="8" class="furniture"/><text x="565.18" y="557.36" class="small" text-anchor="middle">High table</text><rect x="550.06" y="598.72" width="30.24" height="30.24" rx="8" class="cloth"/><rect x="550.06" y="477.76" width="30.24" height="30.24" rx="8" class="cloth"/><rect x="116.62" y="351.76" width="50.40" height="49.14" rx="8" class="cloth"/><circle cx="185.29000000000002" cy="376.33000000000004" r="15.75" class="furniture"/><rect x="116.62" y="139.45" width="50.40" height="49.14" rx="8" class="cloth"/><circle cx="185.29000000000002" cy="164.01999999999995" r="15.75" class="furniture"/><rect x="78.82" y="420.75" width="297.36" height="59.22" rx="0" class="furniture"/><text x="227.50" y="454.36" class="small" text-anchor="middle">Retained stair</text><rect x="70.00" y="495.21" width="248.22" height="324.01" rx="0" class="furniture"/><text x="194.11" y="661.22" class="small" text-anchor="middle">Separate cinema</text><path d="M325.78000000000003,547.06L325.78000000000003,493.51" stroke="#faf9f5" stroke-width="7"/><path d="M325.78000000000003,868.3599999999999L325.78000000000003,830.56" stroke="#faf9f5" stroke-width="7"/><text x="680" y="160" class="body">The wine-bar island stays</text><text x="680" y="189" class="body">The 1.105 m-high island retains its</text><text x="680" y="218" class="body">three high stools and bronze footrail.</text><text x="680" y="247" class="body">Mirrored wine storage lines the wall.</text><text x="680" y="276" class="body"></text><text x="680" y="305" class="body">More places to settle in</text><text x="680" y="334" class="body">Two burgundy club chairs join the sofa.</text><text x="680" y="363" class="body">Stone side tables, books, a low console,</text><text x="680" y="392" class="body">artwork and lamps complete the room.</text><text x="680" y="421" class="body"></text><text x="680" y="450" class="body">Keep the routes usable</text><text x="680" y="479" class="body">The original 1.30 m aisle remains</text><text x="680" y="508" class="body">between the island and drinks cabinet.</text><text x="680" y="537" class="body">The room stays open at both ends.</text><text x="680" y="566" class="body"></text><text x="680" y="595" class="body">A second high table adds two seats.</text><text x="680" y="624" class="body">Darts moves beside pool; play alternately.</text><text x="680" y="653" class="body">The stair-side passing strip remains</text><text x="680" y="682" class="body">approximately 620 mm during pool play.</text><text x="680" y="711" class="body"></text><text x="680" y="740" class="body">Current visual proposal · 16 October 2026</text><text x="680" y="769" class="body">Furniture footprints come from the</text><text x="680" y="798" class="body">same manifest used by the walkthrough.</text><text x="55" y="956" class="small">Concept arrangement. Dimensions from the model; furniture selection and detailed construction remain to be developed.</text></svg>