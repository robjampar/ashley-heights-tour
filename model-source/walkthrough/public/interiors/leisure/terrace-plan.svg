<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030"><style>text{font-family:Arial;fill:#30433b}</style><rect width="1080" height="1030" fill="#fffdf7"/><text x="55" y="55" font-size="30" font-weight="600">Roof terrace · a relaxed outdoor room</text><text x="55" y="91" font-size="19">Proposed only · existing rooflights, guards, privacy screen and doors retained</text><rect x="86.09999999999998" y="178.86" width="860.1999999999999" height="465.97999999999996" rx="3" fill="#eee7da" stroke="#928573" stroke-width="1.5"/><rect x="439.84" y="456.24000000000007" width="92.0" height="92.0" rx="3" fill="#b6d3d5" stroke="#648a8c" stroke-width="1.5"/><rect x="596.24" y="456.24000000000007" width="92.0" height="92.0" rx="3" fill="#b6d3d5" stroke="#648a8c" stroke-width="1.5"/><rect x="752.64" y="456.24000000000007" width="92.0" height="92.0" rx="3" fill="#b6d3d5" stroke="#648a8c" stroke-width="1.5"/><rect x="184.07999999999998" y="269.47999999999996" width="84.63999999999999" height="184.0" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="390.15999999999997" y="378.0400000000001" width="77.28" height="73.59999999999991" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="390.15999999999997" y="278.68000000000006" width="77.28" height="73.59999999999991" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><ellipse cx="332.2" cy="355.9599999999999" rx="23.920000000000012" ry="35.87999999999997" fill="#ccc4b0" stroke="#928573" stroke-width="1.5"/><ellipse cx="720.4399999999999" cy="380.80000000000007" rx="48.300000000000004" ry="48.300000000000004" fill="#c4ab83" stroke="#928573" stroke-width="1.5"/><rect x="695.5999999999999" y="440.6000000000001" width="49.68000000000001" height="49.67999999999992" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="780.24" y="355.96000000000004" width="49.68000000000001" height="49.67999999999992" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="695.5999999999999" y="271.32000000000005" width="49.68000000000001" height="49.67999999999992" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="610.9599999999999" y="355.96000000000004" width="49.68000000000001" height="49.67999999999992" rx="3" fill="#dacbb4" stroke="#928573" stroke-width="1.5"/><rect x="504.23999999999995" y="588.72" width="110.39999999999999" height="44.16000000000004" rx="3" fill="#c4ab83" stroke="#928573" stroke-width="1.5"/><ellipse cx="646.8399999999999" cy="609.8800000000001" rx="21.16" ry="21.16" fill="#91a18a" stroke="#928573" stroke-width="1.5"/><ellipse cx="459.15999999999997" cy="609.8800000000001" rx="20.24" ry="20.24" fill="#91a18a" stroke="#928573" stroke-width="1.5"/><path d="M83.79999999999995 647.6000000000001 L83.79999999999995 176.55999999999997" stroke="#9daea7" stroke-width="10"/><path d="M183.15999999999997 654.96 L403.96 654.96" stroke="#648a8c" stroke-width="7"/><path d="M293.55999999999995 620.0 L293.55999999999995 534.44 L403.03999999999996 534.44 L403.03999999999996 412.08000000000004 L542.88 412.08000000000004 L542.88 230.83999999999997 L899.8399999999999 230.83999999999997" fill="none" stroke="#4d7a60" stroke-width="3" stroke-dasharray="8 6"/><text x="188.67999999999995" y="242.80000000000004" font-size="14">Two-seat sofa</text><text x="303.67999999999995" y="298.0" font-size="12">Coffee</text><text x="692.8399999999999" y="373.44000000000005" font-size="12">Ø1050</text><text x="439.84" y="564.8" font-size="13">Three rooflights kept clear</text><text x="197.87999999999997" y="632.8800000000001" font-size="13">Family-lounge doors</text><text x="511.59999999999997" y="606.2" font-size="12">Cushions</text><text x="116.91999999999999" y="206.92" font-size="13">Clear perimeter maintenance route</text><text x="55" y="730" font-size="21" font-weight="600">Sitting together</text><text x="55" y="764" font-size="17">A timber sofa and two individual</text><text x="55" y="788" font-size="17">lounge chairs face a small stone</text><text x="55" y="812" font-size="17">table. Ivory cushions and</text><text x="55" y="836" font-size="17">restrained bronze details</text><text x="55" y="860" font-size="17">continue the house palette.</text><text x="395" y="730" font-size="21" font-weight="600">Four café places</text><text x="395" y="764" font-size="17">A separate round table fits</text><text x="395" y="788" font-size="17">between the rooflights and guard.</text><text x="395" y="812" font-size="17">The larger indoor dining tables</text><text x="395" y="836" font-size="17">provide extra capacity when</text><text x="395" y="860" font-size="17">needed.</text><text x="735" y="730" font-size="21" font-weight="600">Keep the envelope</text><text x="735" y="764" font-size="17">The terrace remains open.</text><text x="735" y="788" font-size="17">Furniture stays clear of glass,</text><text x="735" y="812" font-size="17">doors, drainage and the outer</text><text x="735" y="836" font-size="17">guards. Planning has no terrace</text><text x="735" y="860" font-size="17">in this location.</text><text x="55" y="945" font-size="16">Developed furniture concept. The retained roof construction, loads, waterproofing, wind restraint, guards</text><text x="55" y="967" font-size="16">and rooflights need project-specific detailed design; this plan does not verify them.</text></svg>