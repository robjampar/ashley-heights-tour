<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="970"><style>text{font-family:Arial,sans-serif;fill:#2d473c}.title{font-size:28px;font-weight:bold}.h{font-size:20px;font-weight:bold}.body{font-size:16px}.small{font-size:12px}.wall{fill:#eeeae0;stroke:#38594a;stroke-width:3}.oak{fill:#c8b491;stroke:#947f5c;stroke-width:2}.white{fill:#faf9f3;stroke:#949b90;stroke-width:2}.chair{fill:#d1d6c5;stroke:#81927e;stroke-width:2}.use{fill:#92b89c44;stroke:#789b82;stroke-dasharray:5 4}</style><rect width="1400" height="970" fill="#faf9f4"/><text x="45" y="48" class="title">Bedroom 3 — a slim king bed and a clear route to the balcony</text><text x="45" y="80" class="body">Keep the south bed wall, window, radiator and both openings. Check complete furniture and occupied arrival.</text><text x="65" y="133" class="h">A · Existing simple furnishings</text><polygon points="65.0,501.52 482.76,501.52 482.76,630.32 609.3199999999999,630.32 609.3199999999999,261.28000000000003 603.7199999999999,261.28000000000003 603.7199999999999,170.0 65.0,170.0" class="wall"/><rect x="207.79999999999998" y="278.08" width="181.44" height="231.84000000000003" rx="3" class="white"/><text x="298.52" y="394.0" text-anchor="middle" class="small">King bed</text><rect x="145.07999999999998" y="427.03999999999996" width="53.76000000000001" height="51.519999999999996" rx="3" class="oak"/><rect x="398.19999999999993" y="427.03999999999996" width="53.76" height="51.519999999999996" rx="3" class="oak"/><rect x="58.839999999999996" y="170.5600000000001" width="67.20000000000002" height="190.39999999999992" rx="3" class="oak"/><text x="92.44" y="265.76000000000005" text-anchor="middle" class="small">1.70 m</text><path d="M185.624,170.0L457.43679999999995,170.0" stroke="#6c9cab" stroke-width="6"/><rect x="242.3408" y="170.0" width="168.0" height="8.567999999999927" rx="3" class="white"/><path d="M603.7199999999999,253.35040000000004L603.7199999999999,169.5744" stroke="#6c9cab" stroke-width="6"/><text x="65" y="670" class="body">Existing west wardrobe overlaps the retained skirting.</text><text x="65" y="698" class="body">The simple bed head partly overlaps its wall.</text><text x="65" y="726" class="body">Loose curtains project into the foot route.</text><text x="755" y="133" class="h">B · Fitted storage and complete bed</text><polygon points="755.0,501.52 1172.76,501.52 1172.76,630.32 1299.32,630.32 1299.32,261.28000000000003 1293.7199999999998,261.28000000000003 1293.7199999999998,170.0 755.0,170.0" class="wall"/><rect x="913.48" y="254.56" width="185.92" height="241.92000000000002" rx="3" class="white"/><text x="1006.44" y="375.52" text-anchor="middle" class="small">King bed</text><rect x="846.28" y="446.08" width="55.999999999999986" height="49.280000000000044" rx="3" class="oak"/><rect x="1110.6" y="446.08" width="56.0" height="49.280000000000044" rx="3" class="oak"/><rect x="758.36" y="178.39999999999992" width="72.8" height="235.20000000000005" rx="3" class="oak"/><text x="794.76" y="295.99999999999994" text-anchor="middle" class="small">2.10 m</text><rect x="1241.6399999999999" y="265.76000000000005" width="53.76000000000005" height="112.0" rx="3" class="chair"/><text x="1268.52" y="321.76000000000005" text-anchor="middle" class="small">perch</text><rect x="1183.4" y="288.15999999999997" width="67.20000000000002" height="67.20000000000006" rx="3" class="use"/><rect x="1189.56" y="556.1088" width="4.480000000000004" height="81.49119999999998" rx="3" class="white"/><polyline points="1273.2912,637.5999999999999 1272.981101381134,630.4975739366021 1272.0531655622685,623.4492016241086 1270.5144546952877,616.5085254317414 1268.3766792989886,609.7283680962192 1265.656109134961,603.1603307088362 1262.3734493848783,596.8543999999999 1258.5536830715632,590.8585679100296 1254.225880923097,585.2184663415122 1249.4229801270292,579.9770198729708 1244.1815336584878,575.1741190769028 1238.5414320899704,570.8463169284369 1232.5456,567.0265506151216 1226.2396692911636,563.7438908650389 1219.6716319037805,561.0233207010114 1212.8914745682584,558.8855453047123 1205.9507983758913,557.3468344377316 1198.9024260633978,556.418898618866 1191.8,556.1088" fill="none" stroke="#7d9987" stroke-dasharray="4 4"/><path d="M875.624,170.0L1147.4368,170.0" stroke="#6c9cab" stroke-width="6"/><rect x="932.3408" y="170.0" width="168.0" height="8.567999999999927" rx="3" class="white"/><path d="M1293.7199999999998,253.35040000000004L1293.7199999999998,169.5744" stroke="#6c9cab" stroke-width="6"/><text x="755" y="670" class="body">650 mm-deep sliding storage fits inside the skirting.</text><text x="755" y="698" class="body">The full 1.66 × 2.16 m bed leaves a single-file foot route.</text><text x="755" y="726" class="body">The luggage perch sits beyond the entrance turn.</text><text x="45" y="825" class="body">The 679 mm gap between bed foot and radiator is retained as a single-file route, not a two-person aisle.</text><text x="45" y="857" class="body">Both door assemblies, occupied wardrobe/perch space and both bed sides require native and circulation checks.</text><text x="45" y="889" class="body">LAYOUT STUDY — see the accompanying room review for the final checks and trade-offs.</text></svg>