<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040"><style>text{font-family:Arial,sans-serif;fill:#243b35}.title{font-size:29px;font-weight:bold}.sub{font-size:17px}.small{font-size:14px}.wall{fill:#eeeae2;stroke:#354b43;stroke-width:3}.furniture{fill:#c8b79d;stroke:#756d60;stroke-width:1.5}.seat{fill:#e2d8c7;stroke:#847c70;stroke-width:1.5}.route{fill:none;stroke:#467e70;stroke-width:2;stroke-dasharray:8 6}</style><rect width="1800" height="1040" fill="#faf9f5"/><text x="60" y="55" class="title">Cinema — compare the ordinary occupied room</text><text x="60" y="88" class="sub">Retain the 3.94 × 5.143 m shell, east doorway and adjacent AV cupboard. Plans in metres; model-based dimensions.</text><text x="65" y="119" class="sub" font-weight="bold">A · Previous six-seat arrangement</text><rect x="65.00" y="150.00" width="350.66" height="457.73" class="wall"/><path d="M415.65999999999997,223.24700000000004L415.65999999999997,150.0" stroke="#faf9f5" stroke-width="5"/><rect x="112.16999999999999" y="595.6280000000002" width="256.32" height="8" fill="#294c44"/><rect x="82.35" y="354.70" width="79.21" height="84.55" class="seat" rx="8"/><rect x="173.13" y="354.70" width="79.21" height="84.55" class="seat" rx="8"/><rect x="263.91" y="354.70" width="79.21" height="84.55" class="seat" rx="8"/><rect x="82.35" y="212.30" width="79.21" height="84.55" class="seat" rx="8"/><rect x="173.13" y="212.30" width="79.21" height="84.55" class="seat" rx="8"/><rect x="263.91" y="212.30" width="79.21" height="84.55" class="seat" rx="8"/><path d="M375.61,184.97700000000006L375.61,476.897" class="route"/><text x="65" y="640.727" class="sub">Two rows; occupied rear sightlines need correction.</text><text x="650" y="119" class="sub" font-weight="bold">B · Four recliners in two rows</text><rect x="650.00" y="150.00" width="350.66" height="457.73" class="wall"/><path d="M1000.66,223.24700000000004L1000.66,150.0" stroke="#faf9f5" stroke-width="5"/><rect x="682.04" y="591.7120000000001" width="231.4" height="8" fill="#294c44"/><rect x="689.16" y="337.17" width="85.44" height="149.52" class="seat" rx="8"/><rect x="820.88" y="337.17" width="85.44" height="149.52" class="seat" rx="8"/><rect x="689.16" y="181.42" width="85.44" height="149.52" class="seat" rx="8"/><rect x="820.88" y="181.42" width="85.44" height="149.52" class="seat" rx="8"/><path d="M960.61,184.97700000000006L960.61,476.897" class="route"/><text x="650" y="640.727" class="sub">Full recline reduces row access; product unverified.</text><text x="1235" y="119" class="sub" font-weight="bold">C · Four places, one viewing row</text><rect x="1235.00" y="150.00" width="350.66" height="457.73" class="wall"/><path d="M1585.6599999999999,223.24700000000004L1585.6599999999999,150.0" stroke="#faf9f5" stroke-width="5"/><rect x="1261.7" y="591.7120000000001" width="231.4" height="8" fill="#294c44"/><rect x="1243.01" y="282.88" width="254.54" height="111.25" class="seat" rx="8"/><rect x="1291.96" y="451.98" width="154.86" height="58.74" class="furniture" rx="10"/><rect x="1255.47" y="154.27" width="218.94" height="23.59" class="furniture" rx="2"/><path d="M1545.6100000000001,184.97700000000006L1545.6100000000001,476.897" class="route"/><text x="1235" y="640.727" class="sub">Develop: clear arrival and side aisle; no platform.</text><circle cx="1279.5" cy="320.25700000000006" r="6" fill="#356f60"/><path d="M1279.5,320.25700000000006L1377.4,595.7120000000001" stroke="#6e9285" stroke-width="1" opacity=".6"/><circle cx="1334.68" cy="320.25700000000006" r="6" fill="#356f60"/><path d="M1334.68,320.25700000000006L1377.4,595.7120000000001" stroke="#6e9285" stroke-width="1" opacity=".6"/><circle cx="1405.88" cy="320.25700000000006" r="6" fill="#356f60"/><path d="M1405.88,320.25700000000006L1377.4,595.7120000000001" stroke="#6e9285" stroke-width="1" opacity=".6"/><circle cx="1461.06" cy="320.25700000000006" r="6" fill="#356f60"/><path d="M1461.06,320.25700000000006L1377.4,595.7120000000001" stroke="#6e9285" stroke-width="1" opacity=".6"/><text x="65" y="755" class="sub">Developed arrangement: 2.86 × 1.25 m fixed sofa, four 620 mm seat places, centre drinks console and low coffee table.</text><text x="65" y="788" class="sub">East aisle: 0.99 m to the shell; approximately 0.94 m after a 50 mm acoustic lining. Rear arrival remains over 1.1 m deep.</text><text x="65" y="821" class="sub">Every seat is in the front row. Modelled eyes are 1.10 m above the floor; a range of users and seated posture still needs review.</text><text x="65" y="854" class="sub">A cinema capacity of four is an explicit trade-off for full-screen views and clear access. No claim of THX or Dolby certification.</text><text x="65" y="887" class="sub">Native furnishings and occupied-route checks are recorded in the room review; detailed acoustic and ventilation design remains.</text></svg>