<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1240" viewBox="0 0 1080 1240"><style>text{font-family:Arial;fill:#30433b}</style><rect width="1080" height="1240" fill="#fffdf7"/><text x="55" y="52" font-size="31" font-weight="600">Arrival · a clear route through the house</text><text x="55" y="90" font-size="19">Useful coat and shoe storage, then an open passage toward the original hall</text><polygon points="144.26,157.60 431.54,157.60 431.54,478.90 245.06,478.90 245.06,315.73 144.26,315.73" fill="#eee7da" stroke="#a09788" stroke-width="1.2"/><polygon points="99.53,1062.91 447.92,1062.91 447.92,745.39 99.53,745.39" fill="#eee7da" stroke="#a09788" stroke-width="1.2"/><polygon points="233.09,730.90 475.96,730.90 475.96,486.14 233.09,486.14" fill="#eee7da" stroke="#a09788" stroke-width="1.2"/><polygon points="189.94,1095.36 447.92,1095.36 447.92,1062.91 189.94,1062.91" fill="#eee7da" stroke="#a09788" stroke-width="1.2"/><polygon points="262.70,1095.36 413.90,1095.36 413.90,1036.13 262.70,1036.13" fill="#f8f6ee" stroke="#b09e86" stroke-width="1.2"/><text x="269.63" y="1055.35" font-size="12">Basement stair opening</text><text x="280.97" y="1074.88" font-size="11">Retained</text><line x1="362.3975" y1="414.01" x2="362.3975" y2="255.25" stroke="#a1a399" stroke-width="4.725"/><line x1="189.935" y1="738.145" x2="227.41999999999993" y2="738.145" stroke="#a1a399" stroke-width="14.49"/><line x1="447.91999999999996" y1="738.145" x2="483.2" y2="738.145" stroke="#a1a399" stroke-width="14.49"/><line x1="483.2" y1="738.145" x2="483.2" y2="745.327" stroke="#a1a399" stroke-width="14.49"/><line x1="189.935" y1="1095.67" x2="189.935" y2="1071.1" stroke="#a1a399" stroke-width="14.49"/><line x1="94.80499999999999" y1="1071.1" x2="94.80499999999999" y2="1039.6" stroke="#a1a399" stroke-width="34.650000000000006"/><line x1="94.80499999999999" y1="825.4000000000001" x2="94.80499999999999" y2="793.9000000000001" stroke="#a1a399" stroke-width="34.650000000000006"/><line x1="108.97999999999999" y1="1039.6" x2="108.97999999999999" y2="986.0500000000001" stroke="#a1a399" stroke-width="14.49"/><line x1="108.97999999999999" y1="878.95" x2="108.97999999999999" y2="825.4000000000001" stroke="#a1a399" stroke-width="14.49"/><line x1="112.13" y1="1060.0749999999998" x2="197.18" y2="1060.0749999999998" stroke="#a1a399" stroke-width="22.049999999999997"/><line x1="112.13" y1="804.925" x2="197.18" y2="804.925" stroke="#a1a399" stroke-width="22.049999999999997"/><line x1="189.935" y1="793.9000000000001" x2="189.935" y2="738.145" stroke="#a1a399" stroke-width="14.49"/><line x1="189.935" y1="1102.915" x2="202.85000000000002" y2="1102.915" stroke="#a1a399" stroke-width="14.49"/><line x1="225.84500000000003" y1="730.9000000000001" x2="225.84500000000003" y2="682.075" stroke="#a1a399" stroke-width="2"/><line x1="225.84500000000003" y1="622.2249999999999" x2="225.84500000000003" y2="499.69" stroke="#a1a399" stroke-width="2"/><line x1="483.2" y1="698.77" x2="483.2" y2="517.3299999999999" stroke="#a1a399" stroke-width="2"/><line x1="483.2" y1="738.145" x2="483.2" y2="698.77" stroke="#a1a399" stroke-width="14.49"/><line x1="483.2" y1="517.3299999999999" x2="483.2" y2="486.145" stroke="#a1a399" stroke-width="14.49"/><line x1="451.7" y1="1102.915" x2="451.7" y2="1090.315" stroke="#a1a399" stroke-width="7.56"/><line x1="451.7" y1="1090.315" x2="451.7" y2="1002.115" stroke="#a1a399" stroke-width="2"/><line x1="451.7" y1="1002.115" x2="451.7" y2="989.5150000000001" stroke="#a1a399" stroke-width="7.56"/><line x1="451.7" y1="926.515" x2="451.7" y2="882.4149999999998" stroke="#a1a399" stroke-width="7.56"/><line x1="451.7" y1="882.4149999999998" x2="451.7" y2="769.0149999999999" stroke="#a1a399" stroke-width="2"/><line x1="451.7" y1="769.0149999999999" x2="451.7" y2="741.5469999999999" stroke="#a1a399" stroke-width="7.56"/><line x1="308.06" y1="1032.985" x2="417.05" y2="1032.985" stroke="#a1a399" stroke-width="2.205"/><line x1="417.05" y1="1095.355" x2="417.05" y2="1032.985" stroke="#a1a399" stroke-width="2.205"/><polygon points="198.44,815.95 218.60,815.95 218.60,749.80 198.44,749.80" fill="#bea37e" stroke="#a09788" stroke-width="1.2"/><polygon points="149.30,836.11 218.60,836.11 218.60,815.95 149.30,815.95" fill="#bea37e" stroke="#a09788" stroke-width="1.2"/><polygon points="417.99,890.29 446.35,890.29 446.35,800.20 417.99,800.20" fill="#d9cbb2" stroke="#a09788" stroke-width="1.2"/><circle cx="252.62" cy="709.48" r="11.97" fill="#8fa383"/><polygon points="219.86,805.24 257.66,805.24 257.66,767.44 219.86,767.44" fill="#80a17855" stroke="#84a180" stroke-width="1.2"/><polygon points="380.51,866.35 418.94,866.35 418.94,828.55 380.51,828.55" fill="#80a17855" stroke="#84a180" stroke-width="1.2"/><line x1="251.99000000000004" y1="459.37" x2="251.99000000000004" y2="420.31" stroke="#7eaaa5" stroke-width="4"/><text x="209.14999999999998" y="769.33" font-size="11">Coats</text><text x="160.64000000000001" y="828.55" font-size="11">Keys</text><text x="422.72" y="812.17" font-size="11">Shoes</text><text x="272.15" y="582.8499999999999" font-size="15">Garden passage</text><text x="261.44" y="211.77999999999997" font-size="14">Original hall</text><text x="260.81" y="376.21000000000004" font-size="11">Existing radiator</text><text x="262.70000000000005" y="437.32" font-size="11">Mirror</text><path d="M152.45000000000002,935.6500000000001 L309.95000000000005,935.6500000000001 L334.52,775.0 L332.0,623.8 L300.5,434.79999999999995 L300.5,223.75" stroke="#4f7c61" stroke-width="3" stroke-dasharray="8 6" fill="none"/><text x="570" y="181" font-size="21" font-weight="600">1 · Arrive without obstruction</text><text x="570" y="211" font-size="17">The entrance link and door position stay. The</text><text x="570" y="234" font-size="17">straight view into the gallery is open, and</text><text x="570" y="257" font-size="17">the garage and basement routes retain their</text><text x="570" y="280" font-size="17">access.</text><text x="570" y="367" font-size="21" font-weight="600">2 · Gather everyday things</text><text x="570" y="397" font-size="17">Two 320 mm-deep legs wrap the wall corner.</text><text x="570" y="420" font-size="17">Coats hang end-on behind sliding fronts. The</text><text x="570" y="443" font-size="17">return contains a bag bay, drawer and</text><text x="570" y="466" font-size="17">limestone key shelf.</text><text x="570" y="553" font-size="21" font-weight="600">3 · Sit to change shoes</text><text x="570" y="583" font-size="17">A 1.43 m bench sits below the gym window. Four</text><text x="570" y="606" font-size="17">open compartments keep shoes close to arrival.</text><text x="570" y="629" font-size="17">Occupied bench and coat-use positions leave</text><text x="570" y="652" font-size="17">the onward route clear.</text><text x="570" y="739" font-size="21" font-weight="600">4 · Keep the garden connection</text><text x="570" y="769" font-size="17">The passage retains its glazing. Continuous</text><text x="570" y="792" font-size="17">limestone and one modest plant connect the new</text><text x="570" y="815" font-size="17">arrival space to the original hall.</text><text x="570" y="925" font-size="21" font-weight="600">5 · Simplify the old hall</text><text x="570" y="955" font-size="17">The original steps retain their geometry, with</text><text x="570" y="978" font-size="17">oak treads, ivory risers and simple bronze</text><text x="570" y="1001" font-size="17">balusters. Plain niche shelves, restrained</text><text x="570" y="1024" font-size="17">bronze lights, a narrow full-height mirror and</text><text x="570" y="1047" font-size="17">shallow relief art update the fittings.</text><text x="55" y="1182" font-size="16">Green areas show separate occupied-use checks. The basement opening, front doors and original stair remain.</text><text x="55" y="1210" font-size="16">Developed concept · dimensions from the model · final joinery, services and measured site fit need detailed design.</text></svg>