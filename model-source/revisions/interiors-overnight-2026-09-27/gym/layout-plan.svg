22.0,553.875L622.0,448.875" stroke="#70a8b8" stroke-width="5"/><path d="M622.0,321.375L622.0,186.37500000000003" stroke="#70a8b8" stroke-width="5"/><path d="M622.0,426.37499999999994L622.0,351.375" stroke="#faf9f4" stroke-width="6"/><path d="M829.75,778.4999999999999L897.25,778.4999999999999" stroke="#faf9f4" stroke-width="6"/><path d="M733.375,158.175L913.375,158.175" stroke="#faf9f4" stroke-width="6"/><path d="M617.5,426.37499999999994L692.5,426.37499999999994" stroke="#476451" stroke-width="3"/><path d="M897.25,778.4999999999999L897.25,714.75" stroke="#476451" stroke-width="3"/><rect x="627.25" y="235.12500000000006" width="131.99999999999997" height="59.249999999999936" class="equipment" rx="3"/><text x="693.25" y="268.75" text-anchor="middle" class="small">← Treadmill</text><rect x="627.25" y="313.875" width="131.99999999999997" height="59.25000000000007" class="equipment" rx="3"/><text x="693.25" y="347.50000000000006" text-anchor="middle" class="small">← Treadmill</text><rect x="761.5" y="443.24999999999994" width="49.500000000000014" height="115.50000000000007" class="equipment" rx="3"/><text x="786.25" y="505.0" text-anchor="middle" class="small">Bench</text><rect x="717.25" y="460.87500000000006" width="138.0" height="5.250000000000021" class="equipment" rx="3"/><rect x="722.5" y="545.625" width="54.00000000000005" height="33.0000000000001" class="furniture" rx="3"/><text x="749.5" y="566.125" text-anchor="middle" class="small">Weights</text><rect x="671.5" y="563.625" width="30.00000000000003" height="15.00000000000008" class="furniture" rx="3"/><rect x="890.875" y="561.75" width="45.74999999999996" height="91.50000000000004" class="equipment" rx="3"/><text x="913.75" y="611.5" text-anchor="middle" class="small">Bike</text><rect x="785.5" y="617.25" width="18.000000000000014" height="67.50000000000003" class="furniture" rx="3"/><rect x="811.75" y="231.0" width="91.50000000000004" height="205.50000000000003" class="rowing" rx="3"/><rect x="834.6250000000001" y="242.24999999999997" width="45.74999999999996" height="183.00000000000003" class="equipment" rx="3"/><text x="857.5000000000001" y="337.75" text-anchor="middle" class="small">Rower</text><text x="831.2500000000001" y="804.75" class="small">Utility door retained</text><text x="55" y="866" class="body">The running state keeps both 2 × 1 m rear safety spaces empty. The east passing strip is approximately 640 mm.</text><text x="55" y="895" class="body">Rowing uses that space only with both treadmills switched off; it is not a third simultaneous cardio position.</text><text x="55" y="924" class="body">The rower separates into two parts for storage. The bench and cable machine stay in place.</text><text x="55" y="953" class="body">Bench, cable and cycling activity areas are tested separately. The room is not an unrestricted multi-user gym.</text><text x="55" y="982" class="body">MyRun and Concept2 dimensions guide the fit. Selected products, exercises, floor loads and ventilation need review.</text><text x="55" y="1011" class="body">PLAN DEVELOPMENT — review the route tests and eye-level model before adopting this arrangement.</text></svg>