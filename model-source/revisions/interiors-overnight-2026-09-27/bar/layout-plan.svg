<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="960" viewBox="0 0 1250 960"><style>text{font-family:Arial,sans-serif;fill:#283f36}.title{font-size:27px;font-weight:bold}.sub{font-size:16px}.small{font-size:12px}.dim{fill:#497266;font-size:13px}.furniture{fill:#c4b297;stroke:#7f7260;stroke-width:1.2}.cloth{fill:#dfd7c7;stroke:#9b917c}.activity{fill:#cfddcf;stroke:#75927b;fill-opacity:.45;stroke-dasharray:6 4}</style><rect width="1250" height="960" fill="#faf9f5"/><text x="55" y="49" class="title">Wine bar &amp; games — ordinary use, drawn together</text><text x="55" y="77" class="sub">Retained basement shell, stair and cinema doors. Oak, limestone, ivory and sage.</text><polygon points="70.0,390.745 325.78000000000003,390.745 325.78000000000003,846.298 611.17,846.298 611.17,100.0 70.0,100.0" fill="#f0ece2" stroke="#405749" stroke-width="4"/><rect x="307.19" y="105.04" width="292.95" height="244.44" class="activity"/><rect x="384.37" y="444.61" width="223.65" height="157.50" class="activity"/><rect x="187.18" y="167.41" width="63.00" height="151.20" class="cloth" rx="8"/><text x="218.68" y="247.01" class="small" text-anchor="middle">Sofa → TV</text><rect x="114.73" y="208.36" width="32.76" height="69.30" class="furniture"/><text x="131.11" y="247.01" class="small" text-anchor="middle">Table</text><rect x="70.00" y="169.93" width="30.87" height="146.16" class="furniture"/><text x="85.44" y="247.01" class="small" text-anchor="middle">TV</text><rect x="394.45" y="192.29" width="118.44" height="69.93" class="furniture"/><text x="453.67" y="231.26" class="small" text-anchor="middle">6 ft pool</text><rect x="409.57" y="672.04" width="126.00" height="45.36" class="furniture"/><text x="472.57" y="698.72" class="small" text-anchor="middle">2 m bar</text><rect x="387.52" y="805.60" width="214.20" height="37.48" class="furniture"/><text x="494.62" y="828.34" class="small" text-anchor="middle">Wine / drinks / glass storage</text><rect x="412.72" y="616.60" width="37.80" height="44.10" fill="#d6bca2" fill-opacity=".45" stroke="#b39276" stroke-dasharray="4 3"/><rect x="417.13" y="627.00" width="28.98" height="28.35" class="cloth" rx="8"/><circle cx="431.62" cy="641.8" r="9" fill="#9c8772"/><rect x="453.67" y="616.60" width="37.80" height="44.10" fill="#d6bca2" fill-opacity=".45" stroke="#b39276" stroke-dasharray="4 3"/><rect x="458.08" y="627.00" width="28.98" height="28.35" class="cloth" rx="8"/><circle cx="472.57000000000005" cy="641.8" r="9" fill="#9c8772"/><rect x="494.62" y="616.60" width="37.80" height="44.10" fill="#d6bca2" fill-opacity=".45" stroke="#b39276" stroke-dasharray="4 3"/><rect x="499.03" y="627.00" width="28.98" height="28.35" class="cloth" rx="8"/><circle cx="513.52" cy="641.8" r="9" fill="#9c8772"/><rect x="78.82" y="390.75" width="297.36" height="59.22" fill="#e2e1dc" stroke="#777"/><text x="227.50" y="424.36" class="small" text-anchor="middle">Retained stair →</text><rect x="70.00" y="465.21" width="248.22" height="324.01" fill="#ebe7df" stroke="#aaa" stroke-dasharray="5 4"/><text x="194.11" y="631.22" class="small" text-anchor="middle">Separate cinema</text><path d="M325.78000000000003,517.06L325.78000000000003,463.51" stroke="#faf9f5" stroke-width="7"/><path d="M325.78000000000003,838.3599999999999L325.78000000000003,800.56" stroke="#faf9f5" stroke-width="7"/><text x="499.03000000000003" y="523.3599999999999" class="dim" text-anchor="middle">DARTS</text><text x="472.57000000000005" y="758.3499999999999" class="dim" text-anchor="middle">1.30 m clear serving aisle</text><text x="453.67" y="313.57" class="dim" text-anchor="middle">Full cue space</text><text x="370.51" y="490.285" class="dim" text-anchor="middle">Cinema entry</text><text x="357.28000000000003" y="819.46" class="dim" text-anchor="middle">AV access</text><polyline points="352.87,419.41 352.87,589.51 357.28000000000003,758.3499999999999 472.57000000000005,758.3499999999999" fill="none" stroke="#4b7a6b" stroke-width="2" stroke-dasharray="6 4"/><polyline points="352.87,419.41 352.87,369.01 272.2299999999999,369.01 270.96999999999997,334.36 168.27999999999997,334.36 168.27999999999997,243.00999999999996" fill="none" stroke="#4b7a6b" stroke-width="2" stroke-dasharray="6 4"/><text x="680" y="128" class="sub" font-weight="bold">A proper place to serve</text><text x="680" y="153" class="sub">1.30 m between the bar and projecting</text><text x="680" y="178" class="sub">back-counter handles. Three stools and</text><text x="680" y="203" class="sub">a full knee overhang face the social room.</text><text x="680" y="228" class="sub"></text><text x="680" y="253" class="sub" font-weight="bold">Storage stays accessible</text><text x="680" y="278" class="sub">The back run begins clear of the small</text><text x="680" y="303" class="sub">retained AV door. Two coolers, drawers,</text><text x="680" y="328" class="sub">glass storage and lit display shelves.</text><text x="680" y="353" class="sub"></text><text x="680" y="378" class="sub" font-weight="bold">Activities have their own space</text><text x="680" y="403" class="sub">Pool: published 6 ft British dimensions,</text><text x="680" y="428" class="sub">with 1.525 m around the playing surface.</text><text x="680" y="453" class="sub">Darts: 2.37 m throw; bull 1.73 m above</text><text x="680" y="478" class="sub">the finished floor; separate activity zone.</text><text x="680" y="503" class="sub"></text><text x="680" y="528" class="sub" font-weight="bold">The honest trade-off</text><text x="680" y="553" class="sub">A larger generic table blocked the route</text><text x="680" y="578" class="sub">to the sofa during play. This standard</text><text x="680" y="603" class="sub">6 ft size leaves a narrow 620 mm passing</text><text x="680" y="628" class="sub">band beside the stairs. Single-file access,</text><text x="680" y="653" class="sub">not a broad main circulation route.</text><text x="680" y="678" class="sub"></text><text x="680" y="703" class="sub" font-weight="bold">Model checks still matter</text><text x="680" y="728" class="sub">Test occupied stools, a cooler door open,</text><text x="680" y="753" class="sub">stair access, AV access and all TV seats.</text><text x="680" y="778" class="sub">Equipment, delivery, acoustics and services</text><text x="680" y="803" class="sub">remain part of detailed design.</text><text x="55" y="922" class="small">Developed concept · 27 September 2026 · Dimensions in metres from the house model. Shaded green areas reserve activities, not fixed furniture.</text></svg>