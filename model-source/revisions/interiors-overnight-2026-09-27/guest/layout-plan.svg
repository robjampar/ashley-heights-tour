="209.70000000000005" width="35.64000000000001" height="35.64000000000001" class="storage"/><path d="M818.4600000000002,589.86L876.78,554.22" stroke="#759684" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M876.78,554.22L908.1000000000001,395.46000000000004" stroke="#759684" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M908.1000000000001,395.46000000000004L818.4600000000002,382.5" stroke="#759684" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M908.1000000000001,395.46000000000004L823.86,220.5" stroke="#759684" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="765" y="755" class="body">Headboard on an uninterrupted solid wall.</text><text x="765" y="780" class="body">Fixed TV between door leaves; garden glazing stays clear.</text><text x="765" y="805" class="body">Check the wardrobe aisle, occupied bed sides and balcony.</text><text x="50" y="905" class="body">Developing dimensions: 1.80 × 2.00 m mattress; full upholstered bed envelope 1.92 × 2.24 m.</text><text x="50" y="936" class="body">South wardrobe depth: 650 mm. Approximately 855 mm from its front to the bed envelope.</text><text x="50" y="967" class="body">The original doorway widths are retained. The 43-inch fixed screen has a modest field of view at this distance.</text><text x="50" y="998" class="body">Compare the bed occupants’ viewing angles separately from screen size; no pivoting TV or movable bed is proposed.</text><text x="50" y="1029" class="body">WORKING STUDY — occupied routes, detailed furniture, doors, outlook and native geometry are not yet verified.</text></svg>