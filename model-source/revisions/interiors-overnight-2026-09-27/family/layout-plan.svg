lipse cx="1151.825" cy="346.44999999999993" rx="23.575" ry="23.575" class="oak"/><rect x="870.075" y="304.47500000000014" width="71.30000000000001" height="75.89999999999992" rx="4" class="use"/><rect x="1304.775" y="341.275" width="51.74999999999999" height="69.00000000000006" rx="4" class="use"/><rect x="868.9250000000001" y="424.07500000000005" width="62.0999999999999" height="43.69999999999999" rx="4" class="use"/><rect x="951.725" y="424.07500000000005" width="62.1" height="43.69999999999999" rx="4" class="use"/><rect x="1034.525" y="424.07500000000005" width="62.1" height="43.69999999999999" rx="4" class="use"/><polyline points="1434.7250000000001,642.575 1300.175,585.075 1267.9750000000001,481.57500000000005 1152.9750000000001,343.57500000000005 1152.9750000000001,168.77499999999998" stroke="#638f7b" stroke-width="3" stroke-dasharray="7 5" fill="none"/><text x="835" y="856" class="body">Sofa fully supported by the existing 2.595 m south wall.</text><text x="835" y="884" class="body">The north-facing desk gets side light from the west window.</text><text x="835" y="912" class="body">Open room and terrace routes remain east of the seating.</text><text x="50" y="1025" class="body">Proposed has inward terrace doors. Planning retains its north window, with no terrace or new external change.</text><text x="50" y="1059" class="body">The new desk is 1.14 × 0.60 m, compared with the old 1.60 × 0.55 m table. It is an occasional writing space.</text><text x="50" y="1093" class="body">Check the pulled-back chair, occupied sofa and storage use separately. A circulation route is not a claim of simultaneous quiet work.</text></svg>