y="347.57500000000005" class="small" text-anchor="middle">desk</text><rect x="159.30000000000004" y="337.25" width="59.800000000000004" height="58.65000000000008" rx="4" class="soft"/><text x="189.20000000000005" y="370.57500000000005" class="small" text-anchor="middle">chair</text><text x="65" y="856" class="body">The desk faces straight toward the west window.</text><text x="65" y="884" class="body">The sofa projects past the end of its solid backing wall.</text><text x="65" y="912" class="body">A shorter desk could improve the window relationship.</text><text x="835" y="147" class="h">B · A compact desk with light from the side</text><polygon points="835.0,589.675 1133.425,589.675 1133.425,750.6750000000001 1269.125,750.6750000000001 1269.125,785.1750000000001 1404.25,785.1750000000001 1404.25,182.0 835.0,182.0" class="wall"/><path d="M835.0,449.95L835.0,306.2" stroke="#6f9ca9" stroke-width="7" fill="none" stroke-dasharray=""/><path d="M981.625,182.0L1257.625,182.0" stroke="#6f9ca9" stroke-width="7" fill="none" stroke-dasharray=""/><path d="M1404.25,785.1750000000001L1404.25,573.575" stroke="#faf9f4" stroke-width="8" fill="none" stroke-dasharray=""/><path d="M986.225,168.77499999999998L986.225,299.30000000000007" stroke="#719896" stroke-width="3" fill="none" stroke-dasharray=""/><polyline points="1116.75,168.77499999999998 1116.2533129684252,180.15100332213802 1114.7670319619185,191.4404283899761 1112.3024684763807,202.55735586200646 1108.8783793280809,213.41717920758288 1104.520823902959,223.93724861370475 1099.2629658289638,234.03749999999985 1093.1448205808206,243.6410643547202 1086.2129509381048,252.67485275433546 1078.5201126143743,261.0701126143741 1070.1248527543357,268.7629509381046 1061.0910643547204,275.6948205808206 1051.4875,281.8129658289638 1041.3872486137047,287.07082390295875 1030.867179207583,291.4283793280806 1020.0073558620065,294.8524684763806 1008.8904283899761,297.3170319619185 997.6010033221381,298.8033129684251 986.225,299.29999999999995" 